# Study settings. Edit this file to change the study; no code changes needed.

[study]
# Labels only. The game plays no audio and never shows these to participants.
# Keep the key to what each label means outside this project.
# Must be an even number of conditions, with one room set per condition.
conditions = ["A", "B"]
room_sets = [["kitchen"], ["living_room"]]
participants_on_run_sheet = 35

[timing]
study_seconds = 30
# Filled delay between study and test, in seconds: quick true/false sums with no
# spatial content. Set to 0 to go straight from the full room to the empty room.
retention_seconds = 30
transition_seconds = 3

[scoring]
# An object scores 1 within this distance of its spot, as a percent of room width.
# Continuous distance and swap errors are recorded as well.
tolerance_percent = 5

[practice]
# A separate room whose objects never appear in the scored rooms.
room = "hallway"
objects = 5
retention_seconds = 10
