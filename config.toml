# Study settings. Edit this file to change the study; no code changes needed.
# The design and the reasons behind it are in docs/RECOGNITION_DESIGN.md.

[study]
# Labels only. The game plays no audio and never shows these to participants.
# Keep the key to what each label means outside this project.
conditions = ["A", "B", "C"]
# Every block shows each of these rooms once, in an order that rotates across
# participants. Each room shows different target photos every time.
rooms = ["storage", "laundry", "workshop"]
# Three conditions give 6 condition orders; 120 participants is 20 per order.
participants_on_run_sheet = 120

[timing]
study_seconds = 30
# Quick true/false sums on a blank screen between the room and the grid.
retention_seconds = 30
# At the start of every block, the "Please wait for the experimenter" screen ignores F8
# for this long after it appears, so the participant settles into the noise first.
block_hold_seconds = 10

[grid]
# Tiles in the recognition grid: the room's targets plus decoys.
columns = 6
rows = 4

[practice]
# One practice room at the start of the session, before any noise. Not saved.
room = "practice"
retention_seconds = 10

[checks]
# Manipulation checks after the last room of every block (not for the baseline group):
# backward digit span first, then the sliders. Saved to P001_checks.csv.
enabled = true

[checks.digit_span]
# Digits are shown one at a time; the participant types them in reverse order.
# Two trials per length; it stops when both trials at one length are wrong.
start_length = 2
max_length = 8
trials_per_length = 2
digit_ms = 800
gap_ms = 200

[[checks.sliders]]
id = "loudness"
question = "How loud was the noise during the last few rooms?"
low = "Not at all loud"
high = "Extremely loud"

[[checks.sliders]]
id = "annoyance"
question = "How annoying was the noise during the last few rooms?"
low = "Not at all annoying"
high = "Extremely annoying"
