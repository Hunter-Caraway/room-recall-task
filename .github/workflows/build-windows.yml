name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller==6.16.0
      - name: Test the logic
        run: python -m pytest -q
        env:
          SDL_VIDEODRIVER: dummy
      - name: Build MemoryTask.exe
        run: >
          pyinstaller --noconfirm --onefile --noconsole --name MemoryTask
          --add-data "assets;assets" --add-data "config.toml;."
          --paths src run_task.py
      - name: Run the self-test inside the .exe
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          $p = Start-Process -FilePath dist\MemoryTask.exe -ArgumentList "--self-test" -Wait -PassThru
          Get-Content dist\selftest.log
          if ($p.ExitCode -ne 0) { exit 1 }
      - name: Package the lab folder
        shell: pwsh
        run: |
          Remove-Item dist\selftest.log
          if (Test-Path dist\data) { Remove-Item -Recurse dist\data }
          Copy-Item config.toml dist\
          Copy-Item docs\LAB_CHECKLIST.md dist\
      - uses: actions/upload-artifact@v4
        with:
          name: MemoryTask-Windows
          path: dist/
          retention-days: 30
