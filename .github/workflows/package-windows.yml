name: Check the Windows download

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements-exe.txt
      - name: Test the logic
        run: python -m pytest -q
      # The way the lab runs it: download the zip, double-click Run Task.bat.
      # This runs that same file, which sets up its own Python in runtime\ first.
      # GitHub's Windows machines have no graphics card, so the window itself is
      # checked on the lab PC.
      - name: Run Task.bat from a fresh download (self-test, smoke test)
        shell: cmd
        env:
          SDL_VIDEODRIVER: dummy
        run: |
          call "Run Task.bat" --self-test < NUL || (type selftest.log & exit /b 1)
          type selftest.log
          call "Run Task.bat" --smoke-test < NUL || exit /b 1
